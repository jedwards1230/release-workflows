# Self-review: this repo reviews its own PRs by calling its own published
# reusable claude-pr-review.yml@v1 (claude-code-action@v1, Haiku, review-team +
# public marketplace + github_ci by default).
name: PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, closed]

permissions:
  contents: read
  actions: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event.action != 'closed'
    uses: jedwards1230/release-workflows/.github/workflows/claude-pr-review.yml@v1
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    with:
      focus: |
        release-workflows hosts REUSABLE GitHub Actions workflows other repos pin.
        - Script injection: untrusted input (PR titles, branch names, event data)
          interpolated as GitHub Actions expressions directly into run: blocks —
          must go via env vars.
        - Least-privilege permissions; never grant more than a job needs.
        - Secret hygiene: no echoing/logging secrets, no secrets in plan/JSON
          output, correct required/optional secret contracts on reusable inputs.
        - Pinned action versions; moving-tag / release correctness.
        Do NOT re-flag yaml formatting — CI owns that.

  # Dogfood the merge-canceller via local path (no @v1 dependency): when one of
  # this repo's own PRs is merged/closed, cancel any in-flight review for it.
  cancel-review:
    if: github.event.action == 'closed'
    permissions:
      actions: write
    uses: ./.github/workflows/claude-pr-review-cancel.yml
    with:
      review_workflow: PR Review
