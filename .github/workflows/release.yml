# This repo's own release: manually dispatched. Self-releases via ai-release.yml
# (the reusable workflow this repo publishes), then force-moves the v0 / v0.x
# tags that consumers pin to the new immutable vX.Y.Z. ai-release.yml only
# creates immutable tags, so this moving-tag job is what keeps `@v0` advancing.
name: Release Workflows

run-name: >-
    Release Workflows: ${{ inputs.custom_version || inputs.version_type }}

on:
    workflow_dispatch:
        inputs:
            version_type:
                description: "Version bump type"
                required: true
                default: "patch"
                type: choice
                options:
                    - major
                    - minor
                    - patch
            custom_version:
                description: "Custom version (optional, overrides version_type)"
                required: false
                type: string

permissions:
    contents: write
    pull-requests: read

jobs:
    release:
        uses: ./.github/workflows/ai-release.yml
        with:
            service_name: release-workflows
            service_description: "reusable GitHub Actions release workflows"
            bump_type: ${{ inputs.version_type }}
            version_override: ${{ inputs.custom_version }}
            create_release: true
        secrets:
            ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    # Maintain the moving v0 / v0.x tags consumers pin (@v0). ai-release.yml
    # only cuts the immutable vX.Y.Z; this points the major/minor tags at it.
    moving-tags:
        needs: release
        if: needs.release.outputs.tag != ''
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - name: Move major/minor tags to the new release
              env:
                  NEW_TAG: ${{ needs.release.outputs.tag }}
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git fetch --tags --force origin
                  VER="${NEW_TAG#v}"
                  IFS='.' read -r MAJOR MINOR _ <<< "${VER}"
                  for MV in "v${MAJOR}" "v${MAJOR}.${MINOR}"; do
                    git tag -f -a "${MV}" "${NEW_TAG}^{commit}" -m "Latest release: ${NEW_TAG}"
                    git push -f origin "${MV}"
                    echo "moved ${MV} -> ${NEW_TAG}" >> "$GITHUB_STEP_SUMMARY"
                  done
