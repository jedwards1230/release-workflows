# Reusable workflow: validates Claude Code plugin marketplace version bumps and
# marketplace.json hygiene, and posts a PR comment summarizing plugin changes.
#
# Consumed by Claude Code plugin marketplaces (single-plugin or multi-plugin
# repos). The check logic is inlined below so this workflow is fully
# self-contained — same-owner private workflow-reuse works for `uses:`, but
# the run-time GITHUB_TOKEN can't read a second private repo, so we cannot
# do a cross-repo checkout of release-workflows itself.
#
# scripts/check-plugin-versions.sh in this repo is the canonical bash source.
# When changing the logic, edit BOTH the script (for local CLI use) and the
# "Check plugin versions" step below (for CI use). The script is kept as-is
# for local pre-push validation: bash scripts/check-plugin-versions.sh origin/main
name: Plugin Version Check

on:
  workflow_call:
    inputs:
      marketplace-path:
        description: "Path to marketplace.json relative to repo root"
        required: false
        type: string
        default: ".claude-plugin/marketplace.json"
      plugins-dir:
        description: "Directory containing plugin subdirectories (matches marketplace.json metadata.pluginRoot)"
        required: false
        type: string
        default: "plugins"
      base-ref:
        description: "Git ref to compare against. Defaults to the PR base SHA on pull_request events, or HEAD~1 on push events."
        required: false
        type: string
        default: ""
      post-pr-comment:
        description: "Post a PR comment summarizing added/removed/updated plugins"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: "Plugin Version Check — ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consuming repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve base ref
        id: base
        env:
          INPUT_BASE_REF: ${{ inputs.base-ref }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$INPUT_BASE_REF" ]]; then
            BASE="$INPUT_BASE_REF"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE="$PR_BASE_SHA"
          else
            BASE="HEAD~1"
          fi
          echo "ref=${BASE}" >> "$GITHUB_OUTPUT"
          echo "Comparing HEAD against ${BASE}"

      - name: Check plugin versions
        env:
          MARKETPLACE_PATH: ${{ inputs.marketplace-path }}
          PLUGINS_DIR: ${{ inputs.plugins-dir }}
          BASE_REF: ${{ steps.base.outputs.ref }}
        # Inlined from scripts/check-plugin-versions.sh — keep both in sync.
        run: |
          set -euo pipefail

          RED='\033[0;31m'
          GREEN='\033[0;32m'
          YELLOW='\033[0;33m'
          NC='\033[0m'

          MARKETPLACE_FILE="${MARKETPLACE_PATH:-.claude-plugin/marketplace.json}"
          PLUGINS_DIR="${PLUGINS_DIR:-plugins}"
          ERRORS_FOUND=0

          declare -a PLUGIN_RESULTS=()
          declare -a ERROR_MESSAGES=()
          METADATA_RESULT=""
          MARKETPLACE_VERSION_DRIFT_RESULT=""

          if ! command -v jq &> /dev/null; then
            echo -e "${RED}ERROR: jq is required but not installed${NC}"
            exit 2
          fi

          error() {
            echo -e "${RED}ERROR: $1${NC}"
            ERROR_MESSAGES+=("$1")
          }
          success() { echo -e "${GREEN}$1${NC}"; }
          info()    { echo -e "${YELLOW}$1${NC}"; }

          get_plugin_version() {
            local plugin_name="$1" ref="$2"
            local plugin_json="${PLUGINS_DIR}/${plugin_name}/.claude-plugin/plugin.json"
            git show "${ref}:${plugin_json}" 2>/dev/null | jq -r '.version // empty' 2>/dev/null || echo ""
          }

          get_metadata_version() {
            local ref="$1"
            git show "${ref}:${MARKETPLACE_FILE}" 2>/dev/null | jq -r '.metadata.version // empty' 2>/dev/null || echo ""
          }

          get_changed_plugins() {
            local base_ref="$1"
            git diff --name-only "${base_ref}"...HEAD -- "${PLUGINS_DIR}/" 2>/dev/null | \
              grep -E "^${PLUGINS_DIR}/[^/]+/" | \
              sed "s|^${PLUGINS_DIR}/\([^/]*\)/.*|\1|" | \
              sort -u || true
          }

          marketplace_changed() {
            local base_ref="$1"
            git diff --name-only "${base_ref}"...HEAD -- "${MARKETPLACE_FILE}" 2>/dev/null | grep -q . && return 0 || return 1
          }

          is_new_plugin() {
            local plugin_name="$1" base_ref="$2" base_version
            base_version=$(get_plugin_version "$plugin_name" "$base_ref")
            [[ -z "$base_version" ]]
          }

          check_no_marketplace_plugin_versions() {
            echo ""
            echo "Checking marketplace.json for stray plugin version fields"
            echo "----------------------------------------"

            if [[ ! -f "$MARKETPLACE_FILE" ]]; then
              error "${MARKETPLACE_FILE} not found"
              ((ERRORS_FOUND++))
              MARKETPLACE_VERSION_DRIFT_RESULT="fail|marketplace.json not found"
              return 1
            fi

            local offenders
            offenders=$(jq -r '[.plugins[]? | select(has("version")) | .name] | join(", ")' "$MARKETPLACE_FILE")

            if [[ -n "$offenders" ]]; then
              error "marketplace.json plugin entries must not set 'version': ${offenders}"
              error "  plugin.json is the source of truth; marketplace-side versions are silently ignored"
              ((ERRORS_FOUND++))
              MARKETPLACE_VERSION_DRIFT_RESULT="fail|Entries with version: ${offenders}"
              return 1
            fi

            success "No stray plugin version fields in marketplace.json"
            MARKETPLACE_VERSION_DRIFT_RESULT="pass|Clean"
            return 0
          }

          validate_plugin() {
            local plugin_name="$1" base_ref="$2"
            local has_errors=0 plugin_status="pass" plugin_details=""

            echo ""
            echo "Checking plugin: ${plugin_name}"
            echo "----------------------------------------"

            local base_plugin_version head_plugin_version
            base_plugin_version=$(get_plugin_version "$plugin_name" "$base_ref")
            head_plugin_version=$(get_plugin_version "$plugin_name" "HEAD")

            if [[ -z "$head_plugin_version" ]]; then
              info "Plugin removed - skipping validation"
              PLUGIN_RESULTS+=("${plugin_name}|pass|Removed (was ${base_plugin_version:-unknown})")
              return 0
            fi

            if is_new_plugin "$plugin_name" "$base_ref"; then
              info "New plugin detected - skipping bump check"
              success "plugin.json version: ${head_plugin_version}"
              PLUGIN_RESULTS+=("${plugin_name}|pass|New plugin, version ${head_plugin_version}")
              return 0
            fi

            if [[ "$base_plugin_version" == "$head_plugin_version" ]]; then
              error "plugin.json version not bumped for ${plugin_name}"
              error "  Base version:    ${base_plugin_version}"
              error "  Current version: ${head_plugin_version}"
              error "  Please increment the version when changing plugin files"
              ((ERRORS_FOUND++))
              has_errors=1
              plugin_status="fail"
              plugin_details="plugin.json not bumped (${base_plugin_version})"
            else
              success "plugin.json version bumped: ${base_plugin_version} -> ${head_plugin_version}"
              plugin_details="${base_plugin_version} → ${head_plugin_version}"
            fi

            PLUGIN_RESULTS+=("${plugin_name}|${plugin_status}|${plugin_details}")
            return $has_errors
          }

          check_metadata_version() {
            local base_ref="$1"

            echo ""
            echo "Checking marketplace metadata version"
            echo "----------------------------------------"

            local base_metadata_version head_metadata_version
            base_metadata_version=$(get_metadata_version "$base_ref")
            head_metadata_version=$(get_metadata_version "HEAD")

            if [[ -z "$head_metadata_version" ]]; then
              error "metadata.version not found in marketplace.json"
              ((ERRORS_FOUND++))
              METADATA_RESULT="fail|metadata.version not found"
              return 1
            fi

            if [[ "$base_metadata_version" == "$head_metadata_version" ]]; then
              error "metadata.version not bumped in marketplace.json"
              error "  Base version:    ${base_metadata_version}"
              error "  Current version: ${head_metadata_version}"
              error "  Please bump metadata.version when plugins change"
              ((ERRORS_FOUND++))
              METADATA_RESULT="fail|Not bumped (${base_metadata_version})"
              return 1
            fi

            success "metadata.version bumped: ${base_metadata_version} -> ${head_metadata_version}"
            METADATA_RESULT="pass|${base_metadata_version} → ${head_metadata_version}"
            return 0
          }

          write_summary() {
            if [[ -z "${GITHUB_STEP_SUMMARY:-}" ]]; then return; fi
            {
              echo "## Plugin Version Check"
              echo ""

              if [[ ${#PLUGIN_RESULTS[@]} -eq 0 && -z "$METADATA_RESULT" && -z "$MARKETPLACE_VERSION_DRIFT_RESULT" ]]; then
                echo "No plugin changes detected."
              else
                if [[ ${#PLUGIN_RESULTS[@]} -gt 0 ]]; then
                  echo "### Plugin Results"
                  echo ""
                  echo "| Plugin | Status | Details |"
                  echo "|--------|--------|---------|"
                  for result in "${PLUGIN_RESULTS[@]}"; do
                    IFS='|' read -r name status details <<< "$result"
                    if [[ "$status" == "pass" ]]; then
                      echo "| \`${name}\` | :white_check_mark: Pass | ${details} |"
                    else
                      echo "| \`${name}\` | :x: Fail | ${details} |"
                    fi
                  done
                  echo ""
                fi

                if [[ -n "$MARKETPLACE_VERSION_DRIFT_RESULT" ]]; then
                  echo "### Marketplace Entry Hygiene"
                  echo ""
                  IFS='|' read -r status details <<< "$MARKETPLACE_VERSION_DRIFT_RESULT"
                  if [[ "$status" == "pass" ]]; then
                    echo ":white_check_mark: \`${MARKETPLACE_FILE}\` plugin entries have no \`version\` fields: ${details}"
                  else
                    echo ":x: \`${MARKETPLACE_FILE}\` plugin entry hygiene: ${details}"
                  fi
                  echo ""
                fi

                if [[ -n "$METADATA_RESULT" ]]; then
                  echo "### Marketplace Metadata"
                  echo ""
                  IFS='|' read -r status details <<< "$METADATA_RESULT"
                  if [[ "$status" == "pass" ]]; then
                    echo ":white_check_mark: \`${MARKETPLACE_FILE}\` **metadata.version**: ${details}"
                  else
                    echo ":x: \`${MARKETPLACE_FILE}\` **metadata.version**: ${details}"
                  fi
                  echo ""
                fi
              fi

              if [[ $ERRORS_FOUND -gt 0 ]]; then
                echo "### :x: Check Failed"
                echo ""
                echo "Found **${ERRORS_FOUND} error(s)**. Please fix the version issues above."
                echo ""
                echo "<details>"
                echo "<summary>How to fix</summary>"
                echo ""
                echo "1. Bump the version in \`${PLUGINS_DIR}/<name>/.claude-plugin/plugin.json\`"
                echo "2. Bump \`metadata.version\` in \`${MARKETPLACE_FILE}\`"
                echo "3. Remove any \`version\` fields from marketplace.json plugin entries"
                echo ""
                echo "**Version bump conventions for metadata.version:**"
                echo "- Plugin added/removed: Major bump (1.2.3 → 2.0.0)"
                echo "- Core metadata changes: Minor bump (1.2.3 → 1.3.0)"
                echo "- Plugin version changes: Patch bump (1.2.3 → 1.2.4)"
                echo ""
                echo "</details>"
              else
                echo "### :white_check_mark: All Checks Passed"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          }

          echo "Plugin Version Check"
          echo "===================="
          echo "Marketplace file: ${MARKETPLACE_FILE}"
          echo "Plugins dir:      ${PLUGINS_DIR}"
          echo "Comparing HEAD against ${BASE_REF}"

          check_no_marketplace_plugin_versions || true

          changed_plugins=$(get_changed_plugins "$BASE_REF")

          if [[ -z "$changed_plugins" ]]; then
            if marketplace_changed "$BASE_REF"; then
              info "No plugin files changed, but marketplace.json was modified"
              check_metadata_version "$BASE_REF" || true
            else
              success "No plugin changes detected - nothing to validate"
            fi
          else
            echo ""
            echo "Changed plugins: $(echo "$changed_plugins" | tr '\n' ' ')"
            for plugin in $changed_plugins; do
              validate_plugin "$plugin" "$BASE_REF" || true
            done
            check_metadata_version "$BASE_REF" || true
          fi

          echo ""
          echo "=========================================="
          if [[ $ERRORS_FOUND -gt 0 ]]; then
            error "Version check failed with ${ERRORS_FOUND} error(s)"
            echo ""
            echo "To fix version errors:"
            echo "  1. Bump the version in ${PLUGINS_DIR}/<name>/.claude-plugin/plugin.json"
            echo "  2. Bump metadata.version in ${MARKETPLACE_FILE}"
            echo "  3. Remove any 'version' fields from marketplace.json plugin entries"
            write_summary
            exit 1
          else
            success "All version checks passed!"
            write_summary
            exit 0
          fi

      - name: Detect plugin changes for PR comment
        if: always() && github.event_name == 'pull_request' && inputs.post-pr-comment
        id: changes
        env:
          MARKETPLACE: ${{ inputs.marketplace-path }}
          PLUGINS_DIR: ${{ inputs.plugins-dir }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          OLD_NAMES=$(git show "$BASE:$MARKETPLACE" 2>/dev/null | jq -r '.plugins[]?.name' | sort -u || true)
          NEW_NAMES=$(git show "$HEAD:$MARKETPLACE" 2>/dev/null | jq -r '.plugins[]?.name' | sort -u || true)

          ADDED=$(comm -13 <(echo "$OLD_NAMES") <(echo "$NEW_NAMES") || true)
          REMOVED=$(comm -23 <(echo "$OLD_NAMES") <(echo "$NEW_NAMES") || true)
          COMMON=$(comm -12 <(echo "$OLD_NAMES") <(echo "$NEW_NAMES") || true)

          plugin_version() {
            local name="$1" ref="$2"
            git show "${ref}:${PLUGINS_DIR}/${name}/.claude-plugin/plugin.json" 2>/dev/null \
              | jq -r '.version // "unknown"' 2>/dev/null || echo "unknown"
          }

          SUMMARY=""
          HAS_CHANGES="false"

          if [ -n "$ADDED" ]; then
            HAS_CHANGES="true"
            SUMMARY+="### ➕ Added Plugins\n\n"
            SUMMARY+="| Plugin | Version |\n|---|---|\n"
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              ver=$(plugin_version "$name" "$HEAD")
              SUMMARY+="| \`$name\` | \`$ver\` |\n"
            done <<< "$ADDED"
            SUMMARY+="\n"
          fi

          if [ -n "$REMOVED" ]; then
            HAS_CHANGES="true"
            SUMMARY+="### ➖ Removed Plugins\n\n"
            SUMMARY+="| Plugin | Last Version |\n|---|---|\n"
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              ver=$(plugin_version "$name" "$BASE")
              SUMMARY+="| \`$name\` | \`$ver\` |\n"
            done <<< "$REMOVED"
            SUMMARY+="\n"
          fi

          UPDATED=""
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            old_ver=$(plugin_version "$name" "$BASE")
            new_ver=$(plugin_version "$name" "$HEAD")
            if [ "$old_ver" != "$new_ver" ]; then
              UPDATED+="| \`$name\` | \`$old_ver\` → \`$new_ver\` |\n"
            fi
          done <<< "$COMMON"

          if [ -n "$UPDATED" ]; then
            HAS_CHANGES="true"
            SUMMARY+="### 🔄 Updated Plugins\n\n"
            SUMMARY+="| Plugin | Version Change |\n|---|---|\n"
            SUMMARY+="$UPDATED\n"
          fi

          OLD_META=$(git show "$BASE:$MARKETPLACE" 2>/dev/null | jq -r '.metadata.version // "unknown"' || echo "unknown")
          NEW_META=$(git show "$HEAD:$MARKETPLACE" 2>/dev/null | jq -r '.metadata.version // "unknown"')
          if [ "$OLD_META" != "$NEW_META" ]; then
            HAS_CHANGES="true"
            SUMMARY+="### 📦 Marketplace Version\n\n"
            SUMMARY+="\`$OLD_META\` → \`$NEW_META\`\n"
          fi

          echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"
          {
            echo "summary<<SUMMARY_EOF"
            printf "$SUMMARY"
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request' && inputs.post-pr-comment && steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.changes.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Delete previous bot comments to avoid duplicates on synchronize
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("Plugin Changes Summary")) | .id' \
            | while read -r id; do
                gh api -X DELETE "repos/${REPO}/issues/comments/$id"
              done

          {
            echo "## 🔌 Plugin Changes Summary"
            echo ""
            printf '%s' "$SUMMARY"
            echo ""
            echo "---"
            echo "> Generated by [check-plugin-versions](${RUN_URL}) workflow."
          } | gh pr comment "$PR_NUMBER" --body-file -
